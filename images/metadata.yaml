  - filename: "flyer.jpg"
    dimensions: "1545x2000"
    description: "This is a flyer for advertising the event. The top half of the image is a slightly wider version of the header image. The bottom half has text with a description of the event, event details (date, times, routes), and website/Facebook links."
    imageText: |
      COWBOY
      GRAVEL GRINDER
      PRESENTED BY:
      COWBOY GRAVEL AND DIVOTS BREWERY
      NEBRASKA'S NEWEST
      GRAVEL RIDE
      Cowboy Gravel Grinder is a self-paced fun gravel ride that will explore the rolling hills and scenic communities surrounding the Norfolk, Ne area. The route starts and ends at the Divots Brewery/Norfolk Lodge and Suites! SAG Support stops are placed along the route every 7-9 miles to be able to refill on water or snacks! Join us for a great day of Gravel, Gears, and Beers (Peers)
      15th May 2027 8:00 AM | 18 Mile, 50K, and 100K Routes | Bonus Ride: 18 Mile Breakfast Ride on Sunday the 16th
      For More Information    www.cowboygravel.bike   Cowboy Gravel Grinder on Facebook

